name: Quality

# KOS-76: hosted CI is disabled org-wide. The lefthook gates and the cargo
# checks below run locally and are authoritative; this workflow is manual
# dispatch only, kept so the Rust gate can be exercised on a clean runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: "3.97.1"
          extra_args: --results=verified,unknown
      # Toolchain pins live in toolchain.json — consumers (cortex) record the
      # same pins in their BOM, so CI must build with exactly that version.
      - name: Read toolchain pins
        shell: bash
        run: node -p 'const t = require("./toolchain.json"); `RUST_VERSION=${t.rust}`' >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
      - run: cargo +"$RUST_VERSION" fmt --all -- --check
      - run: cargo +"$RUST_VERSION" clippy --workspace --all-targets -- -D warnings
      - run: cargo +"$RUST_VERSION" test --workspace
      - name: Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
