[package]
name = "imago-nsh"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared NSH host and Mundus design and Engine crates"

[dependencies]
gpui = { package = "gpui-kit", version = "=0.8.0", features = ["gpui-fast"] }
imago-gpui = { path = "../imago-gpui" }
mundus-gpui-kit = { path = "../mundus-gpui-kit" }
nsh-base = "=0.2.0"
nsh-platform-gpui = { version = "=0.2.0", default-features = false, features = ["js"] }
