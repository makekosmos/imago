[package]
name = "imago-nsh"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared NSH host and Mundus design and Engine crates"

[dependencies]
gpui = { package = "gpui-kit", version = "=0.11.0", features = ["gpui-fast"] }
imago-gpui = { path = "../imago-gpui" }
mundus-gpui-kit = { path = "../mundus-gpui-kit" }
nsh-base = "=0.7.1"
nsh-platform-gpui = { version = "=0.7.1", default-features = false, features = ["js"] }

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.11.0", features = ["gpui-fast", "test-support"] }
