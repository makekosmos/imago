[package]
name = "imago-native-sidebar"
version = "0.1.0"
edition = "2021"
publish = false
description = "A sidebar that is an AppKit source list on macOS and an NSH view elsewhere"

[dependencies]
nsh-core = "=0.3.0"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.3.0", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSImageView", "NSLayoutAnchor", "NSScrollView", "NSStackView", "NSTableCellView", "NSTableColumn", "NSTableHeaderView", "NSTableView", "NSUserInterfaceLayout", "NSView"] }
