# Cargo workspace for the Imago GPUI design layer: imago-gpui (palettes and
# theme tokens) plus mundus-gpui-kit (widgets, shell chrome, Engine client,
# merged in from the archived kosmos-gpui-kit repo under KOS-319). Consumers
# depend on members via git rev; cargo resolves packages inside this
# workspace.
[workspace]
resolver = "2"
members = ["crates/imago-gpui", "crates/mundus-gpui-kit"]
# Patched gpui revision shared by the GPUI apps (KOS-328): vendored crates.io
# sources with local patches, consumed via [patch.crates-io] git rev by apps.
# Not workspace members; local patches below enable shared UI tests here.
exclude = ["crates/gpui-pre", "crates/gpui-pre-windows"]

# Exercise shared controls against the same patched TestWindow used by apps.
# Workspace patches do not propagate to consumers; their Git patches stay pinned.
[patch.crates-io]
gpui-pre = { path = "crates/gpui-pre" }
gpui-pre-windows = { path = "crates/gpui-pre-windows" }

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
# Mirrors the profile consumers (manager-gpui, agenda-gpui) ship with.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
