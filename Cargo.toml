# Cargo workspace for the Imago GPUI design layer: imago-gpui (palettes and
# theme tokens) plus mundus-gpui-kit (widgets, shell chrome, Engine client,
# merged in from the archived kosmos-gpui-kit repo under KOS-319). Consumers
# depend on members via git rev; cargo resolves packages inside this
# workspace.
[workspace]
resolver = "2"
members = ["crates/imago-gpui", "crates/mundus-gpui-kit"]

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
# Mirrors the profile consumers (manager-gpui, agenda-gpui) ship with.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
