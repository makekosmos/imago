# Cargo workspace for the Imago GPUI design layer: imago-gpui (palettes and
# theme tokens) plus mundus-gpui-kit (widgets, shell chrome, Engine client,
# merged in from the archived kosmos-gpui-kit repo under KOS-319). Consumers
# depend on members via git rev; cargo resolves packages inside this
# workspace.
[workspace]
resolver = "2"
members = [
    "crates/imago-gpui",
    "crates/mundus-gpui-kit",
    "crates/imago-nsh",
    "crates/imago-native-sidebar",
    "crates/imago-window-macos",
    "crates/imago-gpui-native-split",
    "crates/window-chrome-demo",
]
exclude = ["crates/gpui-fast"]

# Local patches for Kosmos test-platform behavior and host-owned Windows
# manifests. Consumers pin this Imago rev and apply these overrides too.
[patch.crates-io]
gpui-fast = { path = "crates/gpui-fast" }
gpui-pre = { path = "crates/gpui-pre" }
gpui-pre-macos = { path = "crates/gpui-pre-macos" }

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
# Mirrors the profile consumers (manager-gpui, agenda-gpui) ship with.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# UI probes need debug selectors in test-support builds; the blanket dev
# profile above disables dependency assertions, so re-enable them for gpui-fast.
[profile.dev.package.gpui-fast]
debug-assertions = true

[profile.dev.package.gpui-fast-macros]
debug-assertions = true
